name: Build Project

# Quá trình này sẽ tự động chạy mỗi khi bạn push code lên nhánh main
on:
  push:
    branches: [ "main" ]

jobs:
  build: # Đây chính là chữ "build" bạn đang tìm
    runs-on: ubuntu-latest
    
    steps:
      - name: Lấy code về
        uses: actions/checkout@v3

      - name: Chạy lệnh build (Ví dụ với Node.js)
        run: |
          npm install
          npm run build
          
